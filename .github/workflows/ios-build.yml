name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TropaymentMerchant (Simulator)
    runs-on: macos-15
    defaults:
      run:
        working-directory: TropaymentMerchant

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show Xcode and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Show shared schemes
        run: |
          xcodebuild -list -project TropaymentMerchant.xcodeproj

      - name: List iOS Simulator runtimes
        run: xcrun simctl list runtimes available

      - name: Build for iOS Simulator (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project TropaymentMerchant.xcodeproj \
            -scheme TropaymentMerchant \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            2>&1 | tee xcodebuild.log

      - name: Print last 200 lines of xcodebuild log on failure
        if: failure()
        run: tail -n 200 xcodebuild.log
